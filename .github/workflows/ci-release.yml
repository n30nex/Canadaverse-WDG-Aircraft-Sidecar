name: Test, build, and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh
      - run: |
          cp .env.example .env
          mkdir -p .secrets
          printf '%064d' 0 > .secrets/wdgwars_api_key
          docker compose config --quiet

  windows:
    name: Windows native package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: gvanem/Dump1090
          ref: 252cef736d24e146545aecf7f316c289ef82b3b4
          path: upstream-dump1090
          persist-credentials: false
      - name: Verify and patch decoder source
        shell: pwsh
        run: |
          $expected = "252cef736d24e146545aecf7f316c289ef82b3b4"
          $actual = (git -C upstream-dump1090 rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected Dump1090 commit: $actual" }
          $patch = Join-Path $env:GITHUB_WORKSPACE "windows\dump1090-sbs-only.patch"
          git -C upstream-dump1090 apply --check $patch
          git -C upstream-dump1090 apply $patch
      - name: Build decoder
        shell: pwsh
        run: |
          cmake -S upstream-dump1090/src -B windows-build -G "Visual Studio 17 2022" -A x64
          cmake --build windows-build --config Release --parallel
      - name: Assemble portable package and corresponding source
        shell: pwsh
        run: |
          .\windows\Build-Windows-Package.ps1 `
            -DecoderPath .\upstream-dump1090\dump1090.exe `
            -DecoderLicensePath .\upstream-dump1090\LICENSE `
            -DecoderSourcePath .\upstream-dump1090 `
            -OutputDirectory "$env:RUNNER_TEMP\wdg-release"
      - name: Prove the packaged decoder and local SBS feed
        shell: pwsh
        run: |
          .\windows\Test-Windows-Package.ps1 `
            -PackageRoot "$env:RUNNER_TEMP\wdg-release\WDG-Aircraft-Sidecar-Windows-x64-v1.1.0" `
            -InputFile .\upstream-dump1090\testfiles\long_flight.csv
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-native-release
          path: |
            ${{ runner.temp }}/wdg-release/*.zip
            ${{ runner.temp }}/wdg-release/*.sha256
          if-no-files-found: error
          compression-level: 0

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/n30nex/canadaverse-wdg-aircraft-sidecar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  required-service:
    if: always()
    needs: [test, windows, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Require complete service build
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.windows.result }}" = "success"
          test "${{ needs.image.result }}" = "success"
