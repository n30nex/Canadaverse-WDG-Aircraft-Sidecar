# Minimal decoder settings for WDG Aircraft Sidecar.
# This build exposes only SBS output on 127.0.0.1:30003.
aircrafts = NUL
airports = NUL
homepos = 0,0
location = false
logfile = NUL
cpr-trace = false
gain = 0
rtlsdr-ppm = 0
silent = true
reverse-resolve = false
http-log = false
web-page = NUL
# Used only by the CI file-input test; ignored for a physical SDR.
loops = 1000
